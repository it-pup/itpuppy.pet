<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>itpuppy | autumn</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css">
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>

    <body x-data="app" x-cloak>
        <div class="app">
            <div class="sidebar">
                <h3 class="sidebar__title">itpuppy</h3>
                
                <div class="sidebar__nav">
                    <button 
                        class="sidebar__nav__el" 
                        @click="switchScreen(Screens.ABOUT)"
                        :class="{ 'sidebar__nav__el--active': isScreen(Screens.ABOUT) }"
                    >
                        about
                    </button>

                    <button 
                        class="sidebar__nav__el" 
                        @click="switchScreen(Screens.PROJECTS)"
                        :class="{ 'sidebar__nav__el--active': isScreen(Screens.PROJECTS) }"
                    >
                        projects
                    </button>

                    <button 
                        class="sidebar__nav__el" 
                        @click="switchScreen(Screens.SUPPORT)"
                        :class="{ 'sidebar__nav__el--active': isScreen(Screens.SUPPORT) }"
                    >
                        support
                    </button>

                    <button 
                        class="sidebar__nav__el" 
                        @click="switchScreen(Screens.SOCIALS)"
                        :class="{ 'sidebar__nav__el--active': isScreen(Screens.SOCIALS) }"
                    >
                        socials
                    </button>
                </div>
            </div>

            <div class="content">
                <section class="about section" x-show="isScreen(Screens.ABOUT)" x-transition>
                    about
                </section>

                <section class="projects section" x-show="isScreen(Screens.PROJECTS)" x-transition>
                    projects
                </section>

                <section class="support section" x-show="isScreen(Screens.SUPPORT)" x-transition>
                    support
                </section>

                <section class="socials section" x-show="isScreen(Screens.SOCIALS)" x-transition>
                    socials
                </section>
            </div>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
